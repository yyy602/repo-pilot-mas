[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-pilot-mas"
version = "0.1.0"
description = "A multi-agent code repair system with dynamic task graphs, state management, adversarial review, and test-driven replanning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "PyYAML>=6.0",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
model = [
    "accelerate>=1.0",
    "torch>=2.1",
    "transformers>=4.51",
]
# Phase 7 前端可视化与控制面（只读驾驶舱 + 常驻运行服务）
visualization = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.36",
    "plotly>=5.20",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# 公开基准中的缺陷实现必须保持冻结，不能为静态检查改写。
"data/quixbugs/flatten/flatten.py" = ["UP028"]
