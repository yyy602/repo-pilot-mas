<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#f8fafc"/>
  <style>
    .title { font: 700 26px sans-serif; fill: #0f172a; }
    .label { font: 16px sans-serif; fill: #334155; }
    .value { font: 700 18px sans-serif; fill: #0f172a; }
    .axis { stroke: #94a3b8; stroke-width: 1; }
  </style>
  <text x="500" y="42" class="title" text-anchor="middle">Phase 6 冻结测试集任务完成数（n=10, seed=0）</text>
  <line x1="250" y1="80" x2="250" y2="500" class="axis"/>
  <line x1="250" y1="500" x2="910" y2="500" class="axis"/>
  <text x="230" y="128" class="label" text-anchor="end">Local Single-Agent</text>
  <rect x="250" y="95" width="66" height="48" rx="8" fill="#94a3b8"/><text x="330" y="126" class="value">1/10</text>
  <text x="230" y="213" class="label" text-anchor="end">Fixed Hybrid</text>
  <rect x="250" y="180" width="132" height="48" rx="8" fill="#60a5fa"/><text x="396" y="211" class="value">2/10</text>
  <text x="230" y="298" class="label" text-anchor="end">Dynamic Hybrid</text>
  <rect x="250" y="265" width="462" height="48" rx="8" fill="#22c55e"/><text x="726" y="296" class="value">7/10</text>
  <text x="230" y="383" class="label" text-anchor="end">No Second Diagnosis</text>
  <rect x="250" y="350" width="396" height="48" rx="8" fill="#f59e0b"/><text x="660" y="381" class="value">6/10</text>
  <text x="230" y="468" class="label" text-anchor="end">No Challenge/Rebuttal</text>
  <rect x="250" y="435" width="396" height="48" rx="8" fill="#f59e0b"/><text x="660" y="466" class="value">6/10</text>
  <text x="500" y="540" class="label" text-anchor="middle">单次小样本结果，不代表统计显著性或通用仓库修复能力</text>
</svg>
