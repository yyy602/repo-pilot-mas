supervisor:
  provider: dashscope_openai_compatible
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  credential_file: .env.supervisor

  routing:
    strategy: model_first_account_second
    model_order:
      - qwen3.8-max
      - deepseek-v4-pro-0813
      - deepseek-v4-flash-0731
    api_key_envs:
      - DASHSCOPE_API_KEY_1
      - DASHSCOPE_API_KEY_2

  failover:
    max_retries_per_route: 1
    initial_backoff_seconds: 2
    per_route_timeout_seconds: 60
    quota_exhausted_error_codes:
      - AllocationQuota.FreeTierOnly
    quota_exhausted_message_patterns:
      - Free allocated quota exceeded
    transient_error_codes:
      - Throttling
      - Throttling.RateQuota
      - Throttling.AllocationQuota
      - ModelUnavailable

  generation:
    temperature: 0.0
    max_output_tokens: 2048
    # Supervisor 必须输出严格 JSON；DashScope 官方建议结构化输出关闭思考模式。
    enable_thinking: false
    timeout_seconds: 120
    max_format_repairs: 1

  recovery:
    additional_schema_retries: 1
    safe_fallback_enabled: true
