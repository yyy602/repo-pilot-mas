name: closed-loop-ci

on:
  push:
    branches:
      - agent/hypothesis-patch-closed-loop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest
      - name: Ruff
        run: python -m ruff check .
      - name: Diff whitespace check
        run: git diff --check HEAD^
